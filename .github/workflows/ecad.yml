name: ECAD gates

# The electrical layer's checks, per reports/HANDOFF.md:
#   cargo check --release --tests
#   cargo test -p elec --lib
# The headless drawing verification needs the built Windows binary and Studio-less
# fixtures that are not in the repository (the customer DXFs are git-ignored), so it runs
# on a developer machine following reports/HANDOFF.md rather than here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ecad-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ecad-

      - name: Type-check the app and its tests
        run: cargo check --release --tests

      - name: Run the electrical domain tests
        run: cargo test -p elec --lib

      - name: Build the release binary
        run: cargo build --release -j 2

      - name: Headless ECAD smoke suite
        env:
          PYTHONUTF8: "1"
        run: >-
          python tests/ecad/run_smoke.py
          --baseline target/release/OpenCADStudio.exe
          --current target/release/OpenCADStudio.exe
          --no-real-sheets
